name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Apple Silicon and Intel packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" ./scripts/package-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/CodexBuddy-v*-arm64.zip \
            build/CodexBuddy-v*-arm64.zip.sha256 \
            build/CodexBuddy-v*-x86_64.zip \
            build/CodexBuddy-v*-x86_64.zip.sha256 \
            --title "CodexBuddy $GITHUB_REF_NAME" \
            --generate-notes
